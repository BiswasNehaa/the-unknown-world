<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Unknown — Arrival (preview)</title>
<style>
  :root{ --amber:#e8b06b; --teal:#3fa9a0; --black:#050403; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{ background:var(--black); }
  body{ background:var(--black); color:#fff; font-family:'Courier New', monospace; overflow:hidden; }
  #scene{ position:fixed; inset:0; width:100%; height:100vh; z-index:1; background:var(--black); }
  #scene canvas{ display:block; }
  #overlay{ position:fixed; inset:0; z-index:2; pointer-events:none; }

  #caption{
    position:absolute; top:26px; left:50%; transform:translateX(-50%);
    text-align:center; color:#8fbfb9; letter-spacing:4px;
    font-size:0.72rem; text-transform:uppercase; width:100%; padding:0 20px;
  }
  #note{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    color:#4c5a59; font-size:0.62rem; letter-spacing:1px; text-align:center; width:100%;
  }
  /* the invitation to click the world */
  #enter-label{
    position:absolute; top:63%; left:50%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-family:'Century Gothic','Questrial','Segoe UI',system-ui,sans-serif;
    text-transform:uppercase; white-space:nowrap; transition:opacity .5s;
  }
  #enter-label .t{ color:#cdeee8; letter-spacing:3px; font-size:0.8rem; text-shadow:0 0 14px rgba(63,169,160,0.9); }
  #enter-label .h{
    color:#f0c890; letter-spacing:5px; font-size:0.62rem; text-shadow:0 0 10px rgba(232,176,107,0.75);
    animation:beckon 1.7s ease-in-out infinite;
  }
  @keyframes beckon{ 0%,100%{ opacity:0.45; } 50%{ opacity:1; } }
  /* status once you've committed */
  #status{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#cdeee8; font-family:'Century Gothic','Questrial','Segoe UI',system-ui,sans-serif;
    letter-spacing:8px; font-size:0.8rem; text-transform:uppercase; opacity:0; transition:opacity 1s;
    text-shadow:0 0 16px rgba(63,169,160,0.8);
  }
  /* intro fade-up from black + arrival haze */
  #veil{ position:fixed; inset:0; z-index:3; background:var(--black); pointer-events:none; }
  #haze{ position:fixed; inset:0; z-index:3; background:radial-gradient(circle at 50% 55%, rgba(190,232,226,0.9), rgba(120,200,192,0.5) 55%, rgba(80,150,150,0) 80%); opacity:0; pointer-events:none; }
</style>
</head>
<body>

  <div id="scene"></div>
  <div id="overlay">
    <div id="caption">Your world &middot; arrival</div>
    <div id="enter-label"><span class="t">My planet</span><span class="h">click to enter &#8594;</span></div>
    <div id="status">Entering</div>
    <div id="note">preview module &middot; click the world to dive in</div>
  </div>
  <div id="veil"></div>
  <div id="haze"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  /* ================================================================
     THE UNKNOWN — arrival PREVIEW (standalone module) v1
     The payoff of "click to enter": her teal world hangs in space,
     slowly turning, atmosphere aglow. Click it and a hands-off
     cinematic dive swoops down until the clouds fill the screen —
     poised above the cloud tops, ready to descend into the world.
     Nothing here touches the other modules.
  ================================================================ */

  const MU = THREE.MathUtils;
  const sceneEl = document.getElementById('scene');

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050403, 0.00016);

  const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 8000);
  camera.position.set(0, 0, 520);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  sceneEl.appendChild(renderer.domElement);

  /* ---- soft round sprite (halo, stars) ---- */
  function makeGlowTexture(){
    const c = document.createElement('canvas'); c.width=c.height=128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64,64,0, 64,64,64);
    g.addColorStop(0.0,'rgba(255,255,255,1)');
    g.addColorStop(0.25,'rgba(255,255,255,0.7)');
    g.addColorStop(0.55,'rgba(255,255,255,0.18)');
    g.addColorStop(1.0,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = makeGlowTexture();

  /* ---- living teal world: deep sea + land masses + polar frost ---- */
  function makeWorldTexture(){
    const s = 512, c = document.createElement('canvas'); c.width=c.height=s; const x=c.getContext('2d');
    x.fillStyle = '#155e57'; x.fillRect(0,0,s,s);                 // deep sea
    // ocean depth variation
    for(let i=0;i<80;i++){ const px=Math.random()*s,py=Math.random()*s,r=20+Math.random()*70;
      const g=x.createRadialGradient(px,py,0,px,py,r);
      g.addColorStop(0,'rgba(30,120,110,'+(0.15+Math.random()*0.25)+')'); g.addColorStop(1,'rgba(30,120,110,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill(); }
    // land masses (clustered blobs, teal-green)
    for(let k=0;k<8;k++){
      const cx=Math.random()*s, cy=60+Math.random()*(s-120);
      for(let i=0;i<26;i++){ const a=Math.random()*Math.PI*2, d=Math.random()*70;
        const px=cx+Math.cos(a)*d, py=cy+Math.sin(a)*d, r=10+Math.random()*26;
        x.fillStyle='rgba('+(28+Math.random()*30|0)+','+(92+Math.random()*30|0)+','+(70+Math.random()*20|0)+','+(0.55+Math.random()*0.35)+')';
        x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill(); }
    }
    // frosty poles
    for(const py of [8, s-8]){ const g=x.createLinearGradient(0,py<10?0:s-70,0,py<10?70:s);
      g.addColorStop(py<10?0:1,'rgba(220,240,236,0.55)'); g.addColorStop(py<10?1:0,'rgba(220,240,236,0)');
      x.fillStyle=g; x.fillRect(0,py<10?0:s-70,s,70); }
    return new THREE.CanvasTexture(c);
  }

  /* ---- transparent cloud shell (white puffs on clear) ---- */
  function makeCloudTexture(){
    const s = 512, c = document.createElement('canvas'); c.width=c.height=s; const x=c.getContext('2d');
    x.clearRect(0,0,s,s);
    for(let i=0;i<46;i++){ const px=Math.random()*s,py=Math.random()*s,r=14+Math.random()*46;
      const g=x.createRadialGradient(px,py,0,px,py,r);
      const a=0.35+Math.random()*0.45;
      g.addColorStop(0,'rgba(240,250,248,'+a+')'); g.addColorStop(0.6,'rgba(230,245,242,'+(a*0.4)+')'); g.addColorStop(1,'rgba(230,245,242,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill(); }
    return new THREE.CanvasTexture(c);
  }

  /* ---- faint background stars ---- */
  const BG = 1500, bgPos = new Float32Array(BG*3);
  for(let i=0;i<BG;i++){ bgPos[i*3]=(Math.random()-0.5)*5000; bgPos[i*3+1]=(Math.random()-0.5)*5000; bgPos[i*3+2]=-3600+Math.random()*3200; }
  const bgGeo = new THREE.BufferGeometry(); bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos,3));
  const bgStars = new THREE.Points(bgGeo, new THREE.PointsMaterial({ size:4, map:glowTex, color:0xcfe0e6, transparent:true, opacity:0.55, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true }));
  scene.add(bgStars);

  /* ---- lighting: a warm sun off to one side + faint teal fill ---- */
  const sun = new THREE.DirectionalLight(0xfff0d6, 1.7); sun.position.set(1, 0.55, 0.8); scene.add(sun);
  scene.add(new THREE.AmbientLight(0x16302c, 0.75));      // faint teal night-side fill

  /* ================================================================
     THE WORLD — surface + drifting clouds + atmosphere rim + bloom
  ================================================================ */
  const R = 150;
  const world = new THREE.Group(); scene.add(world);
  world.rotation.z = 0.18;                                 // slight axial tilt

  const planet = new THREE.Mesh(
    new THREE.SphereGeometry(R, 64, 48),
    new THREE.MeshStandardMaterial({ map:makeWorldTexture(), roughness:0.95, metalness:0.02, emissive:0x08322e, emissiveIntensity:0.35 })
  );
  world.add(planet);

  const cloudTex = makeCloudTexture();
  const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(R*1.02, 48, 32),
    new THREE.MeshStandardMaterial({ map:cloudTex, transparent:true, opacity:0.9, depthWrite:false, roughness:1 })
  );
  world.add(clouds);

  // atmosphere shell — backside additive so the limb glows
  const atmo = new THREE.Mesh(
    new THREE.SphereGeometry(R*1.09, 48, 32),
    new THREE.MeshBasicMaterial({ color:0x53c9be, transparent:true, opacity:0.42, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  world.add(atmo);

  // soft outer bloom behind the planet
  const haloMat = new THREE.SpriteMaterial({ map:glowTex, color:0x3fa9a0, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false });
  const halo = new THREE.Sprite(haloMat); halo.scale.set(R*3.4, R*3.4, 1); halo.position.z = -R*0.6; scene.add(halo);

  /* ---- interaction: click the world to commit to the dive ---- */
  const ray = new THREE.Raycaster();
  let hover=false, committed=false, clickTime=0;
  const enterLabel = document.getElementById('enter-label');
  const statusEl = document.getElementById('status');
  addEventListener('pointermove', e=>{
    if(committed) return;
    ray.setFromCamera({ x:(e.clientX/innerWidth)*2-1, y:-(e.clientY/innerHeight)*2+1 }, camera);
    hover = ray.intersectObject(planet).length > 0;
    document.body.style.cursor = hover ? 'pointer' : 'default';
  });
  addEventListener('click', ()=>{
    if(committed || !hover) return;
    committed = true; clickTime = clock.getElapsedTime();
    enterLabel.style.opacity = 0;
    statusEl.style.opacity = 1;
    document.body.style.cursor = 'default';
  });

  /* ---- mouse parallax (only before committing) ---- */
  let mx=0, my=0, lookX=0, lookY=0;
  addEventListener('mousemove', e=>{ mx = e.clientX/innerWidth - 0.5; my = e.clientY/innerHeight - 0.5; });

  const veil = document.getElementById('veil'), haze = document.getElementById('haze');
  const clock = new THREE.Clock();
  const DIVE = 3.6;                                        // seconds of hands-off swoop
  function easeInOut(x){ return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }

  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // world turns; clouds drift a touch faster
    planet.rotation.y += 0.0009;
    clouds.rotation.y += 0.0013;
    atmo.material.opacity = 0.36 + 0.06*Math.sin(t*0.8);

    // fade up from black over the first ~1.2s
    veil.style.opacity = Math.max(0, 1 - t/1.2);

    if(!committed){
      // gentle parallax drift while it invites the click
      const tx = mx*26, ty = -my*26;
      lookX += (tx-lookX)*0.05; lookY += (ty-lookY)*0.05;
      camera.position.set(lookX*0.4, lookY*0.4, 520);
      camera.lookAt(lookX*0.1, lookY*0.1, 0);
    } else {
      // hands-off cinematic dive: ease the camera down to the cloud tops
      const d = MU.clamp((t - clickTime)/DIVE, 0, 1);
      const e = easeInOut(d);
      const camZ = MU.lerp(520, R*1.14, e);                // end just above the surface
      const camY = MU.lerp(0, -R*0.28, e);                 // tip toward the cloud tops
      camera.position.set(0, camY, camZ);
      camera.lookAt(0, camY + R*0.32*e, 0);
      atmo.material.opacity = 0.4 + 0.35*e;                // atmosphere brightens as we plunge in
      // near the end, bloom the arrival haze to blend into the descent
      haze.style.opacity = MU.smoothstep(e, 0.82, 1) * 0.9;
      if(d >= 1) statusEl.textContent = 'Descending';
    }

    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
