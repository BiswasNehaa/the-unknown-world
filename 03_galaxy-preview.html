<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Unknown — Galaxy</title>
<style>
  :root{ --amber:#e8b06b; --teal:#3fa9a0; --black:#050403; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{ background:var(--black); }
  body{ background:var(--black); color:#fff; font-family:'Courier New', monospace; height:500vh; overflow-x:hidden; }
  #scene{ position:fixed; inset:0; width:100%; height:100vh; z-index:1; background:var(--black); }
  #scene canvas{ display:block; }
  #overlay{ position:fixed; inset:0; z-index:2; pointer-events:none; }
  #scroll-hint{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    color:#8fdfd8; font-family:'Century Gothic','Questrial','Segoe UI',system-ui,sans-serif;
    letter-spacing:7px; font-size:0.8rem; text-transform:uppercase; text-align:center;
  }
  #scroll-hint .arrow{ display:block; margin-top:10px; font-size:1.05rem; animation:bob 1.9s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); opacity:0.45; } 50%{ transform:translateY(9px); opacity:1; } }
  #trans-fade{ position:fixed; inset:0; z-index:9999; background:#000; opacity:1; pointer-events:none; transition:opacity 1.2s ease; }
</style>
</head>
<body>

  <div id="scene"></div>
  <div id="overlay">
    <div id="scroll-hint">SCROLL<span class="arrow">&#8595;</span></div>
  </div>
  <div id="trans-fade"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  if('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);

  /* fade IN from black on arrival (this page was linked-to from spacecraft) */
  requestAnimationFrame(()=>{ document.getElementById('trans-fade').style.opacity = '0'; });

  const MU = THREE.MathUtils;
  const sceneEl = document.getElementById('scene');

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050403, 0.00022);

  const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 9000);
  camera.position.set(0, 0, 600);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  sceneEl.appendChild(renderer.domElement);

  function makeGlowTexture(){
    const c = document.createElement('canvas'); c.width=c.height=64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32,32,0, 32,32,32);
    g.addColorStop(0.0,'rgba(255,255,255,1)');
    g.addColorStop(0.2,'rgba(255,255,255,0.9)');
    g.addColorStop(0.5,'rgba(255,255,255,0.25)');
    g.addColorStop(1.0,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = makeGlowTexture();

  function makeDiskTexture(){
    const c = document.createElement('canvas'); c.width=c.height=256;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(128,128,0, 128,128,128);
    g.addColorStop(0.00,'rgba(255,246,230,0.95)');
    g.addColorStop(0.22,'rgba(255,226,180,0.45)');
    g.addColorStop(0.55,'rgba(120,205,198,0.20)');
    g.addColorStop(0.80,'rgba(80,150,150,0.06)');
    g.addColorStop(1.00,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  }
  const diskTex = makeDiskTexture();

  function makeNebulaTexture(){
    const c = document.createElement('canvas'); c.width=c.height=128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64,64,0, 64,64,64);
    g.addColorStop(0.00,'rgba(255,255,255,0.55)');
    g.addColorStop(0.35,'rgba(255,255,255,0.22)');
    g.addColorStop(0.70,'rgba(255,255,255,0.06)');
    g.addColorStop(1.00,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  const nebTex = makeNebulaTexture();

  const BG = 2500;
  const bgPos = new Float32Array(BG*3);
  for(let i=0;i<BG;i++){
    bgPos[i*3+0] = (Math.random()-0.5)*4000;
    bgPos[i*3+1] = (Math.random()-0.5)*4000;
    bgPos[i*3+2] = -3500 + Math.random()*3500;
  }
  const bgGeo = new THREE.BufferGeometry();
  bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos,3));
  const bgMat = new THREE.PointsMaterial({
    size:4, map:glowTex, color:0x9fb6c9, transparent:true, opacity:0.5,
    depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true,
  });
  const bgStars = new THREE.Points(bgGeo, bgMat);
  scene.add(bgStars);

  const galaxyTilt = new THREE.Group();
  const galaxySpin = new THREE.Group();
  galaxyTilt.add(galaxySpin);
  galaxyTilt.rotation.x = 1.05;
  galaxyTilt.position.set(0, 0, -2600);
  scene.add(galaxyTilt);

  const GCOUNT = 26000, ARMS = 3, GMAX = 900;

  const diskHaze = new THREE.Mesh(
    new THREE.PlaneGeometry(GMAX*2.7, GMAX*2.7),
    new THREE.MeshBasicMaterial({ map:diskTex, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  galaxySpin.add(diskHaze);

  const gpos = new Float32Array(GCOUNT*3);
  const gcol = new Float32Array(GCOUNT*3);
  const cCore = [1.00, 0.83, 0.50];
  const cMid  = [0.62, 0.86, 0.92];
  const cEdge = [0.22, 0.72, 0.68];
  function lerp3(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }

  for(let i=0;i<GCOUNT;i++){
    const rnd = Math.random();
    const rr = Math.pow(rnd, 1.15);
    const radius = 40 + rr*GMAX;
    const arm = i % ARMS;
    const baseAngle = (arm/ARMS)*Math.PI*2;
    const spin = radius*0.0052;
    const onArm = Math.random() > 0.30;
    const armWidth = 0.26 + 0.34*rr;
    const angle = onArm ? (baseAngle + spin + (Math.random()-0.5)*armWidth*2) : (Math.random()*Math.PI*2);
    const rj = (Math.random()-0.5) * (55 + 120*rr);
    const rad2 = radius + rj;
    const px = Math.cos(angle)*rad2 + (Math.random()-0.5)*18;
    const py = Math.sin(angle)*rad2 + (Math.random()-0.5)*18;
    const thick = (Math.random()-0.5) * ((1-rr)*80 + 16);
    gpos[i*3+0]=px; gpos[i*3+1]=py; gpos[i*3+2]=thick;
    const col = rr < 0.45 ? lerp3(cCore, cMid, rr/0.45) : lerp3(cMid, cEdge, (rr-0.45)/0.55);
    let b = 0.55 + 0.45*(1-rr) + Math.random()*0.25;
    if(!onArm) b *= 0.7;
    gcol[i*3+0]=col[0]*b; gcol[i*3+1]=col[1]*b; gcol[i*3+2]=col[2]*b;
  }
  const gGeo = new THREE.BufferGeometry();
  gGeo.setAttribute('position', new THREE.BufferAttribute(gpos,3));
  gGeo.setAttribute('color',    new THREE.BufferAttribute(gcol,3));
  const gMat = new THREE.PointsMaterial({
    size:4.2, map:glowTex, vertexColors:true, transparent:true, opacity:0,
    depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true,
  });
  const galaxyPoints = new THREE.Points(gGeo, gMat);
  galaxySpin.add(galaxyPoints);

  const baseCol = gcol.slice(0);
  const twPhase = new Float32Array(GCOUNT);
  for(let i=0;i<GCOUNT;i++) twPhase[i] = Math.random()*Math.PI*2;

  const NEB_COLORS = [0xffb066, 0x33c4ba, 0xffc98a, 0x2fb6c9, 0xffb066, 0x35cbbf, 0x9fd0ff, 0xffbe86, 0x38c2b6];
  const nebulas = [];
  for(let k=0;k<NEB_COLORS.length;k++){
    const m = new THREE.SpriteMaterial({
      map:nebTex, color:NEB_COLORS[k], transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false,
    });
    m.rotation = Math.random()*Math.PI*2;
    const s = new THREE.Sprite(m);
    const ang = Math.random()*Math.PI*2;
    const rad = (0.25 + Math.random()*0.62)*GMAX;
    const z0  = (Math.random()-0.5)*60;
    s.position.set(Math.cos(ang)*rad, Math.sin(ang)*rad, z0);
    const sx = 320 + Math.random()*360;
    const sy = sx*(0.6 + Math.random()*0.5);
    s.scale.set(sx, sy, 1);
    galaxySpin.add(s);
    nebulas.push({ s, m, z0, base: 0.10 + Math.random()*0.09, phase: Math.random()*Math.PI*2, speed: 0.10 + Math.random()*0.18 });
  }

  const K = 64;
  const kpos = new Float32Array(K*3);
  const kcol = new Float32Array(K*3);
  const kBase  = new Float32Array(K*3);
  const kPhase = new Float32Array(K);
  const knotColor = [0.75, 0.90, 1.00];
  for(let j=0;j<K;j++){
    const rr = 0.30 + Math.random()*0.60;
    const radius = 40 + rr*GMAX;
    const arm = j % ARMS;
    const baseAngle = (arm/ARMS)*Math.PI*2;
    const spin = radius*0.0052;
    const angle = baseAngle + spin + (Math.random()-0.5)*0.14;
    kpos[j*3+0] = Math.cos(angle)*radius + (Math.random()-0.5)*28;
    kpos[j*3+1] = Math.sin(angle)*radius + (Math.random()-0.5)*28;
    kpos[j*3+2] = (Math.random()-0.5)*22;
    const b = 0.85 + Math.random()*0.15;
    kBase[j*3+0]=knotColor[0]*b; kBase[j*3+1]=knotColor[1]*b; kBase[j*3+2]=knotColor[2]*b;
    kcol[j*3+0]=kBase[j*3+0]; kcol[j*3+1]=kBase[j*3+1]; kcol[j*3+2]=kBase[j*3+2];
    kPhase[j]=Math.random()*Math.PI*2;
  }
  const knotGeo = new THREE.BufferGeometry();
  knotGeo.setAttribute('position', new THREE.BufferAttribute(kpos,3));
  knotGeo.setAttribute('color',    new THREE.BufferAttribute(kcol,3));
  const knotMat = new THREE.PointsMaterial({
    size:11, map:glowTex, vertexColors:true, transparent:true, opacity:0,
    depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true,
  });
  const knots = new THREE.Points(knotGeo, knotMat);
  galaxySpin.add(knots);

  const coreMat = new THREE.SpriteMaterial({ map:glowTex, color:0xffcf9a, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  const core = new THREE.Sprite(coreMat);
  core.scale.set(360, 360, 1);
  galaxySpin.add(core);

  const coreHotMat = new THREE.SpriteMaterial({ map:glowTex, color:0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  const coreHot = new THREE.Sprite(coreHotMat);
  coreHot.scale.set(140, 140, 1);
  galaxySpin.add(coreHot);

  let targetProgress = 0, progress = 0;
  function computeScroll(){
    const max = document.body.scrollHeight - innerHeight;
    targetProgress = max>0 ? (scrollY/max) : 0;
  }
  addEventListener('scroll', computeScroll, { passive:true });
  computeScroll();

  let mx=0, my=0, lookX=0, lookY=0;
  addEventListener('mousemove', e=>{
    mx = e.clientX/innerWidth - 0.5;
    my = e.clientY/innerHeight - 0.5;
  });

  /* scene-to-scene link: fade to black near the bottom of scroll, then move on */
  let transitioning = false;
  const fadeEl = document.getElementById('trans-fade');
  function goNext(){
    if(transitioning) return;
    transitioning = true;
    fadeEl.style.opacity = '1';
    setTimeout(()=>{ window.location.href = '4-solar-system.html'; }, 1250);
  }

  const clock = new THREE.Clock();
  function smooth(x){ return MU.smoothstep(x, 0, 1); }

  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    progress += (targetProgress - progress) * 0.06;
    const p = progress;

    const camZ = 600 - p*2900;
    camera.position.set(0, 0, camZ);

    const targetLookX = mx*40, targetLookY = -my*40;
    lookX += (targetLookX - lookX)*0.05;
    lookY += (targetLookY - lookY)*0.05;
    camera.lookAt(lookX, lookY, camZ - 500);

    galaxySpin.rotation.z += 0.0009;
    galaxyTilt.rotation.x = 1.05 + smooth(MU.clamp((p-0.6)/0.4, 0, 1))*0.34;

    const fade = MU.clamp((p - 0.03)/0.20, 0, 1);
    diskHaze.material.opacity = fade * 0.75;
    gMat.opacity       = fade * 0.95;
    coreMat.opacity    = fade * 0.85;
    coreHotMat.opacity = fade * 0.9;
    bgMat.opacity      = 0.5 * (1 - fade*0.4);

    if(fade > 0.001){
      const carr = gGeo.attributes.color.array;
      for(let i=0;i<GCOUNT;i++){
        const f = 0.80 + 0.20*Math.sin(t*1.5 + twPhase[i]);
        carr[i*3+0] = baseCol[i*3+0]*f;
        carr[i*3+1] = baseCol[i*3+1]*f;
        carr[i*3+2] = baseCol[i*3+2]*f;
      }
      gGeo.attributes.color.needsUpdate = true;

      for(const n of nebulas){
        const breathe = 0.65 + 0.35*Math.sin(t*n.speed + n.phase);
        n.m.opacity = fade * n.base * breathe;
        n.s.position.z = n.z0 + Math.sin(t*n.speed*0.7 + n.phase)*22;
      }

      const karr = knotGeo.attributes.color.array;
      for(let j=0;j<K;j++){
        const f = 0.45 + 0.55*Math.abs(Math.sin(t*1.1 + kPhase[j]));
        karr[j*3+0] = kBase[j*3+0]*f;
        karr[j*3+1] = kBase[j*3+1]*f;
        karr[j*3+2] = kBase[j*3+2]*f;
      }
      knotGeo.attributes.color.needsUpdate = true;
      knotMat.opacity = fade * 0.95;
      knotMat.size    = 10 + 2.2*Math.sin(t*0.9);
    }

    if(p > 0.985) goNext();

    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
